[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:agent_engine]
command=uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/agent_engine_stderr.log
stdout_logfile=/var/log/supervisor/agent_engine_stdout.log

[program:task_queue_daemon]
command=python3 run_task_queue_daemon.py
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/task_queue_stderr.log
stdout_logfile=/var/log/supervisor/task_queue_stdout.log
